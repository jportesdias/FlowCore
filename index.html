<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowCore Academy</title>
<meta name="description" content="FlowCore Academy, uma divisão da FlowCore Solutions.">
<meta name="theme-color" content="#FAFAF8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B2B30;
    --muted:#5F636C;
    --navy:#1F4E8C;
    --navy-deep:#173B6B;
    --orange:#D2691E;
    --line:#E4E6EA;
    --bg:#FAFAF8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }
  .frame{
    position:fixed; inset:16px;
    border:1px solid var(--line);
    border-radius:4px;
    pointer-events:none;
    z-index:0;
  }
  header,footer{
    position:relative; z-index:2;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:36px 56px;
    font-size:11px; font-weight:400;
    letter-spacing:.28em; text-transform:uppercase;
    color:var(--muted);
  }
  header a{color:var(--muted); text-decoration:none; display:inline-flex; align-items:center; gap:10px; padding:10px 0; transition:color .3s}
  header a:hover,header a:focus-visible{color:var(--navy)}
  .mark{display:inline-flex; align-items:center; gap:10px}
  .mark i{width:6px;height:6px;border-radius:50%;background:var(--orange);display:block}

  main{
    position:relative; z-index:1;
    flex:1;
    display:flex; align-items:center; justify-content:center;
    padding:24px 16px 40px;
  }
  .rings{
    position:absolute; left:50%; top:50%;
    width:min(1100px,150vw); height:auto;
    transform:translate(-50%,-50%);
    pointer-events:none;
    color:var(--navy);
  }
  .stage{
    position:relative;
    display:flex; flex-direction:column; align-items:center;
    gap:64px;
  }
  .brand{
    display:block;
    border-radius:8px;
    outline-offset:16px;
    opacity:0;
    animation:enter 1.2s cubic-bezier(.2,.7,.2,1) .1s forwards;
  }
  .brand img{
    display:block;
    width:min(680px,82vw); height:auto;
    transition:transform .7s cubic-bezier(.2,.7,.2,1);
  }
  .brand:hover img{transform:scale(1.012)}
  .btn{
    display:inline-flex; align-items:center; gap:18px;
    min-height:52px; padding:0 30px 0 28px;
    border-radius:999px;
    background:var(--navy);
    color:#fff; text-decoration:none;
    font-size:12px; font-weight:500;
    letter-spacing:.26em; text-transform:uppercase;
    opacity:0;
    animation:enter 1.2s cubic-bezier(.2,.7,.2,1) .45s forwards;
    transition:background .3s ease, gap .4s cubic-bezier(.2,.7,.2,1);
  }
  .btn .dot{width:7px;height:7px;border-radius:50%;background:var(--orange)}
  .btn svg{transition:transform .4s cubic-bezier(.2,.7,.2,1)}
  .btn:hover,.btn:focus-visible{background:var(--navy-deep)}
  .btn:hover svg,.btn:focus-visible svg{transform:translateX(4px)}
  a:focus-visible{outline:2px solid var(--navy)}

  footer{justify-content:center; padding-top:20px}
  footer span+span::before{content:"";display:inline-block;width:24px;height:1px;background:var(--line);vertical-align:middle;margin:0 16px}

  @keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:640px){
    .frame{inset:8px}
    header,footer{padding:24px 24px; font-size:10px; letter-spacing:.2em}
    header .mark span{display:none}
    .stage{gap:44px}
    .btn{font-size:11px; letter-spacing:.2em; padding:0 24px}
    footer{flex-direction:column; gap:8px}
    footer span+span::before{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .brand,.btn{animation:none;opacity:1}
    .brand img,.btn,.btn svg{transition:none}
  }
</style>
</head>

<script>
(function(){
  var svg=document.querySelector('.rings');
  var g=svg.querySelector('.spin');
  var orb=svg.querySelector('.orb');
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cur=0, target=0, rad=5, lastMove=0, tracking=false, prev=performance.now();
  function point(x,y){
    var r=svg.getBoundingClientRect();
    target=Math.atan2(y-(r.top+r.height/2), x-(r.left+r.width/2))*180/Math.PI;
    lastMove=performance.now(); tracking=true;
  }
  window.addEventListener('pointermove',function(e){point(e.clientX,e.clientY)},{passive:true});
  document.documentElement.addEventListener('pointerleave',function(){tracking=false});
  function tick(now){
    var dt=Math.min(now-prev,50)/1000; prev=now;
    if(tracking && now-lastMove>2500) tracking=false;
    if(tracking){
      var d=((target-cur)%360+540)%360-180;
      cur+=d*Math.min(1,dt*5);
    } else {
      cur+=4*dt;
    }
    rad+=((tracking?7:5)-rad)*Math.min(1,dt*6);
    g.setAttribute('transform','rotate('+cur.toFixed(2)+' 600 600)');
    orb.setAttribute('r',rad.toFixed(2));
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
